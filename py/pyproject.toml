[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hpqc"
version = "0.0.2"
description = "Python port of katzenpost/hpqc: hybrid post-quantum cryptography and BACAP."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "David Stainton" },
]
keywords = [
    "cryptography",
    "post-quantum",
    "hybrid",
    "bacap",
    "mkem",
    "ctidh",
    "x25519",
    "ed25519",
    "falcon",
    "katzenpost",
    "mixnet",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "pynacl>=1.6",
    "cryptography>=47.0",
    "highctidh>=1.0.2025051200",
    "cbor2>=6.0",
    "pqcrypto>=0.4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0",
]

[project.urls]
Homepage = "https://katzenpost.network/"
Repository = "https://github.com/katzenpost/hpqc"
Issues = "https://github.com/katzenpost/hpqc/issues"

[tool.hatch.build.targets.wheel]
packages = ["hpqc"]

[tool.hatch.build.targets.sdist]
include = [
    "hpqc/",
    "tests/",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
