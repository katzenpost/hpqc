name: MacOS Golang build and test

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  macos:
    name: macos (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Display Go version
        shell: bash
        run: go version

      - name: Install golang dependencies
        shell: bash
        env:
          HIGHCTIDH_PORTABLE: "1"
          CGO_ENABLED: "1"
        run: go get -v ./...

      - name: Build golang
        shell: bash
        env:
          HIGHCTIDH_PORTABLE: "1"
          CGO_ENABLED: "1"
        run: go build -v ./...

      - name: Golang test
        shell: bash
        env:
          HIGHCTIDH_PORTABLE: "1"
          CGO_ENABLED: "1"
          CGO_LDFLAGS: -Wl,-stack_size,0x1F40000
        run: go test -v ./...

  build:
    needs: macos
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.macos.result }}" = success
