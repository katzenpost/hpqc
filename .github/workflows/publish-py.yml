#
# Builds the hpqc Python distribution and publishes it via PyPI's
# trusted-publishing flow (OIDC). No long-lived API tokens are
# stored anywhere; PyPI authenticates the workflow run by matching
# its OIDC claims against a publisher rule registered at
# https://pypi.org/manage/account/publishing/ for project "hpqc",
# repository "katzenpost/hpqc", workflow "publish-py.yml", and
# environment "pypi" (and "testpypi" on test.pypi.org).
#
# Release flow:
#   - bump version in py/pyproject.toml and py/hpqc/__init__.py
#   - tag the commit "py/v<version>" and push the tag
#   - this workflow builds and publishes to PyPI
#
# Dry runs to TestPyPI are available via the "Run workflow" button
# in the Actions tab (workflow_dispatch).

name: Publish hpqc Python to PyPI

on:
  push:
    tags:
      - 'py/v*'
  workflow_dispatch:

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build py

      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: py/dist/

  smoke-test:
    name: Smoke-import the wheel before publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Install wheel into a fresh venv and import the public modules
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "
          import hpqc
          from hpqc.bacap import WriteCap, ReadCap, MessageBoxIndex
          from hpqc.kem.mkem import MKEMScheme
          from hpqc.nike.x25519 import X25519
          from hpqc.nike.scheme import Scheme
          from hpqc.sign.ed25519 import VerifyKey
          assert hpqc.__version__, 'hpqc.__version__ should be populated'
          mkem = MKEMScheme(X25519())
          pk, sk = mkem.generate_keypair()
          eph, ct = mkem.encapsulate([pk], b'smoke')
          assert mkem.decapsulate(sk, ct) == b'smoke'
          wc = WriteCap.generate()
          mbi = wc.first_message_box_index
          box, c, s = mbi.encrypt_for_context(wc, b'ctx', b'hello')
          assert mbi.decrypt_for_context(box, b'ctx', c, s) == b'hello'
          print('smoke OK, version', hpqc.__version__)
          "

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: smoke-test
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/hpqc
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/py/v')
    needs: smoke-test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hpqc
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
