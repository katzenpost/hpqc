name: Rust tests
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - name: cargo test
        run: cargo test --locked
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
  no-std:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy --target thumbv7em-none-eabihf && rustup default stable
      # highctidh/external skips highctidh's C build; firmware links the C itself.
      - name: cargo build for a no_std target
        run: cargo build --locked --target thumbv7em-none-eabihf --no-default-features --features bacap,voucher,kem,highctidh/external
      - name: cargo test bacap and voucher without default features
        run: cargo test --locked --no-default-features --features bacap,voucher
      - name: cargo clippy without default features
        run: cargo clippy --locked --all-targets --no-default-features --features bacap,voucher -- -D warnings
