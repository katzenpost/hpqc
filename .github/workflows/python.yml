name: Python tests
on: [pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test deps
        working-directory: py
        run: pip install -e '.[test]'
      - name: Run pytest
        working-directory: py
        run: pytest -v

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build py
      - name: twine check
        run: twine check py/dist/*
      - name: Wheel must contain LICENSE
        run: |
          unzip -l py/dist/*.whl | grep -q 'dist-info/licenses/LICENSE' \
            || (echo "wheel is missing LICENSE under .dist-info/licenses/" && exit 1)
