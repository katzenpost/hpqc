name: Debian packages

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "packaging=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          want='^(debian/|packaging/|\.github/workflows/deb\.yml$)'
          if git diff --name-only "$BASE"...HEAD | grep -qE "$want"; then
            echo "packaging=true" >> "$GITHUB_OUTPUT"
          else
            echo "packaging=false" >> "$GITHUB_OUTPUT"
          fi

  tag:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    outputs:
      ref_debian_13: ${{ steps.refs.outputs.ref_debian_13 }}
      ref_debian_forky: ${{ steps.refs.outputs.ref_debian_forky }}
      ref_ubuntu_24_04: ${{ steps.refs.outputs.ref_ubuntu_24_04 }}
      ref_ubuntu_26_04: ${{ steps.refs.outputs.ref_ubuntu_26_04 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - id: refs
        run: make deb-image-refs >> "$GITHUB_OUTPUT"

  image:
    needs: [changes, tag]
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        distro:
          - debian-13
          - debian-forky
          - ubuntu-24.04
          - ubuntu-26.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$TOKEN" \
            | docker login ghcr.io -u "$ACTOR" --password-stdin
      - run: make deb-image-push DISTRO=${{ matrix.distro }} PODMAN=docker

  deb:
    needs: [changes, tag, image]
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        key:
          - ref_debian_13
          - ref_debian_forky
          - ref_ubuntu_24_04
          - ref_ubuntu_26_04
    container:
      image: ${{ needs.tag.outputs[matrix.key] }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: make deb-ci

  deb-result:
    needs: [changes, tag, image, deb]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Report the Debian package verdict
        env:
          PACKAGING: ${{ needs.changes.outputs.packaging }}
          CHANGES: ${{ needs.changes.result }}
          TAG: ${{ needs.tag.result }}
          IMAGE: ${{ needs.image.result }}
          DEB: ${{ needs.deb.result }}
        run: |
          echo "changes: $CHANGES ($PACKAGING), tag: $TAG, image: $IMAGE, deb: $DEB"
          # A skipped build passes only when changes ran and found nothing to
          # build; a skip caused by a failed tag or image job does not.
          if [ "$CHANGES" = success ] && [ "$PACKAGING" = false ]; then
            echo "::notice::no packaging files changed"
            exit 0
          fi
          for result in "$CHANGES" "$TAG" "$IMAGE" "$DEB"; do
            if [ "$result" != success ]; then
              echo "::error::the Debian package build did not pass"
              exit 1
            fi
          done
